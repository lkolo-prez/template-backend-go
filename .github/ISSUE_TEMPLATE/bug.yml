name: Bug report
description: Report a defect in the service, build or CI.
title: "bug: <short summary>"
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. Do **not** include secrets, credentials or full
        request/response bodies that may contain sensitive values.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and the impact.
      placeholder: POST /api/v1/widgets returns 500 when ...
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      value: |
        1. make run
        2. curl -X POST localhost:8080/api/v1/widgets -d '...'
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options: [cmd/server, config, httpserver, handlers, observability, docker, ci-cd, other]
    validations:
      required: true
  - type: input
    id: go-version
    attributes:
      label: Go version
      placeholder: "go1.23.4"
    validations:
      required: true
  - type: input
    id: service-version
    attributes:
      label: Service version / commit / image digest
      placeholder: "v0.1.0 (commit abc1234) or ghcr.io/aircloud/template-backend-go@sha256:..."
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs (redacted)
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I removed all secrets and sensitive values.
          required: true
