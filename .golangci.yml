# golangci-lint configuration (strict). Docs: https://golangci-lint.run
# Run locally with: golangci-lint run
run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly
  allow-parallel-runners: true

output:
  formats:
    - format: colored-line-number
  sort-results: true

linters:
  disable-all: true
  enable:
    - asasalint        # detect []any passed to ...any
    - asciicheck       # non-ASCII identifiers
    - bidichk          # dangerous unicode sequences
    - bodyclose        # HTTP response body closed
    - contextcheck     # inherit context correctly
    - copyloopvar      # loop variable copy (Go 1.22+)
    - dupl             # duplicate code
    - durationcheck    # multiplied durations
    - errcheck         # unchecked errors
    - errname          # error naming conventions
    - errorlint        # error wrapping (%w, errors.Is/As)
    - exhaustive       # exhaustive switches on enums
    - gocheckcompilerdirectives
    - gochecknoinits   # no init() functions
    - goconst          # repeated strings -> const
    - gocritic         # opinionated checks
    - gocyclo          # cyclomatic complexity
    - godot            # comments end with a period
    - gofumpt          # stricter gofmt
    - goimports        # import grouping
    - gosec            # security issues
    - govet            # vet
    - ineffassign      # ineffectual assignments
    - misspell         # spelling
    - nakedret         # no naked returns in long funcs
    - nilerr           # return nil after non-nil err
    - noctx            # http requests without context
    - nolintlint       # well-formed nolint directives
    - prealloc         # slice preallocation
    - predeclared      # shadowing predeclared identifiers
    - revive           # golint replacement
    - rowserrcheck     # sql.Rows.Err checked
    - sloglint         # structured logging best practices
    - staticcheck      # staticcheck suite
    - tenv             # t.Setenv usage
    - testifylint      # testify best practices
    - thelper          # test helpers call t.Helper()
    - tparallel        # t.Parallel correctness
    - unconvert        # unnecessary conversions
    - unparam          # unused function parameters
    - unused           # unused code
    - usestdlibvars    # use stdlib constants
    - wastedassign     # wasted assignments
    - whitespace       # leading/trailing whitespace

linters-settings:
  gocyclo:
    min-complexity: 20
  govet:
    enable-all: true
    disable:
      - fieldalignment # too noisy for this template
  revive:
    rules:
      - name: exported
        arguments: [checkPrivateReceivers, disableStutteringCheck]
  sloglint:
    attr-only: true
    key-naming-case: snake
  exhaustive:
    default-signifies-exhaustive: true
  gosec:
    excludes:
      - G104 # handled by errcheck

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-rules:
    - path: _test\.go
      linters:
        - dupl
        - gocyclo
        - gosec
        - goconst
  exclude-use-default: false
