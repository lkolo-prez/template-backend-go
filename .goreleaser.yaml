# GoReleaser v2 configuration. Invoked by .github/workflows/release.yml after
# release-please tags a SemVer release. Docs: https://goreleaser.com
version: 2

project_name: template-backend-go

before:
  hooks:
    - go mod tidy
    - go mod verify

builds:
  - id: server
    main: ./cmd/server
    binary: server
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .FullCommit }}
      - -X main.date={{ .Date }}
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

# Keyless signing of the checksums file with cosign (OIDC, no keys).
signs:
  - cmd: cosign
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--yes"
      - "--output-signature=${signature}"
      - "--output-certificate=${certificate}"
      - "${artifact}"
    artifacts: checksum
    output: true

sboms:
  - id: archive-sbom
    artifacts: archive

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  disable: true # release-please owns the changelog

release:
  github:
    owner: aircloud
    name: template-backend-go
  prerelease: auto
  mode: append
